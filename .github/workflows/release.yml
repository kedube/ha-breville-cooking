# Run by hand on main: Actions -> Release -> Run workflow, or
# `gh workflow run release.yml -f bump=major`. Once CI passes, each run raises
# the version (minor: 0.13 -> 0.14, 0.99 -> 1.00; major: 0.13 -> 1.00), makes
# CHANGELOG.md's Unreleased section that version's, then commits, tags and
# publishes it, with the changelog section as the release notes' Highlights.
# Tags are the bare version, with no "v" in front.
name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: minor adds 0.01 (0.13 -> 0.14); major goes to the next whole version (0.13 -> 1.00)"
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch the tags too, so that an existing tag fails the run early.
          fetch-depth: 0

      - name: Bump version and rotate the changelog
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(python3 scripts/bump_version.py --bump "$BUMP" --write)
          python3 scripts/changelog.py rotate "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "Release $VERSION" custom_components/breville_cooking/manifest.json CHANGELOG.md
          git tag --annotate "$VERSION" --message "Release $VERSION"
          # The commit and the tag land together, or neither does.
          git push --atomic origin HEAD:main "refs/tags/$VERSION"

      - name: Build zip
        working-directory: custom_components/breville_cooking
        run: zip -r "$GITHUB_WORKSPACE/breville_cooking.zip" .

      # GitHub's generated notes list only merged pull requests, and most
      # changes go straight to main, so the notes are built from the changelog
      # and the commits since the last release.
      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/changelog.py notes "$VERSION" "$RUNNER_TEMP/release_notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$VERSION" breville_cooking.zip
          --title "$VERSION" --notes-file "$RUNNER_TEMP/release_notes.md" --verify-tag
